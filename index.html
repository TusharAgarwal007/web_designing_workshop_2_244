<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Marks and Grade Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    input {
      padding: 6px;
      font-size: 16px;
      width: 120px;
    }
    button {
      padding: 6px 12px;
      font-size: 16px;
      margin-left: 8px;
    }
    .marks-container {
      margin-top: 16px;
    }
    .marks-container label {
      display: block;
      margin-top: 8px;
    }
    #result {
      margin-top: 18px;
      font-size: 18px;
      font-weight: bold;
    }
    .section {
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h2>Student Marks and Grade Calculator</h2>

  <label for="numSubjects">Number of subjects: </label>
  <input type="number" id="numSubjects" min="1" />
  <button onclick="generateInputs()">Generate Inputs</button>

  <div id="marksContainer" class="marks-container"></div>
  <button id="calculateBtn" onclick="calculateResult()" style="display:none; margin-top:12px;">Calculate Result</button>

  <div id="result"></div>

  <script>
    let subjectCount = 0;

    function generateInputs() {
      const numInput = document.getElementById("numSubjects");
      const marksContainer = document.getElementById("marksContainer");
      const calculateBtn = document.getElementById("calculateBtn");

      subjectCount = parseInt(numInput.value, 10);

      if (subjectCount <= 0 || !Number.isInteger(subjectCount)) {
        marksContainer.innerHTML = "Please enter a positive number of subjects.";
        calculateBtn.style.display = "none";
        return;
      }

      marksContainer.innerHTML = "";

      // Use a loop to create input fields for marks
      for (let i = 1; i <= subjectCount; i++) {
        const label = document.createElement("label");
        label.textContent = `Subject ${i} marks: `;

        const input = document.createElement("input");
        input.type = "number";
        input.id = `sub${i}`;
        input.min = "0";
        input.max = "100";
        input.step = "0.01";

        label.appendChild(input);
        marksContainer.appendChild(label);
      }

      calculateBtn.style.display = "inline";
      document.getElementById("result").textContent = "";
    }

    function calculateResult() {
      const resultDiv = document.getElementById("result");
      let total = 0;
      let valid = true;

      // Use a loop to read marks and validate
      for (let i = 1; i <= subjectCount; i++) {
        const val = parseFloat(document.getElementById(`sub${i}`).value);

        if (isNaN(val) || val < 0 || val > 100 || !Number.isFinite(val)) {
          valid = false;
          break;
        }
        total += val;
      }

      if (!valid) {
        resultDiv.textContent = "Please enter valid marks (0–100) for all subjects.";
        return;
      }

      const average = total / subjectCount;

      let grade;
      let passFail;

      // if-else for grade and pass/fail
      if (average >= 80) {
        grade = "A";
        passFail = "Pass";
      } else if (average >= 70) {
        grade = "B";
        passFail = "Pass";
      } else if (average >= 60) {
        grade = "C";
        passFail = "Pass";
      } else if (average >= 40) {
        grade = "D";
        passFail = "Pass";
      } else {
        grade = "F";
        passFail = "Fail";
      }

      // FIXED & COMPLETED: Dynamically injects results into the HTML
      resultDiv.innerHTML = `
        <hr>
        <p>Total Marks: ${total.toFixed(2)}</p>
        <p>Average Marks: ${average.toFixed(2)}%</p>
        <p>Grade: ${grade}</p>
        <p>Status: <span style="color: ${passFail === 'Pass' ? 'green' : 'red'};">${passFail}</span></p>
      `;
    }
  </script>
</body>
</html>
